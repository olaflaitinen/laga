name: Bug report
description: Report a reproducible bug in laga with enough detail to diagnose and fix it.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        The more context you provide, the faster we can reproduce and fix the issue.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which slice of laga seems broken?
      options:
        - Public API
        - CLI
        - Parser / repair behavior
        - Tokenizer
        - Error handling
        - Documentation
        - Packaging / release
        - Tests / CI
        - GitHub workflow
        - Other
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How disruptive is the issue?
      options:
        - Blocking
        - High
        - Medium
        - Low
        - Cosmetic
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      description: How often can you reproduce it?
      options:
        - Always
        - Most of the time
        - Sometimes
        - Rarely
        - Only once
    validations:
      required: true

  - type: dropdown
    id: input-shape
    attributes:
      label: Input shape
      description: What does the failing input look like?
      options:
        - Small JSON object
        - Nested JSON structure
        - Array-heavy payload
        - Markdown fenced output
        - Prose plus JSON
        - CLI stdin input
        - File contents
        - Unknown / mixed text
    validations:
      required: true

  - type: dropdown
    id: strict-mode
    attributes:
      label: Strict mode status
      description: Did the problem happen in strict mode?
      options:
        - strict=False
        - strict=True
        - Both
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: version-line
    attributes:
      label: Version line
      description: Which version line are you using?
      options:
        - 0.1.6
        - 0.1.5
        - 0.1.4
        - 0.1.3
        - 0.1.1
        - Older than 0.1.1
        - From main branch
        - Not sure
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the bug in one or two sentences.
      placeholder: laga returns the wrong structure when ...
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: Failing input
      description: Paste the smallest sample that reproduces the bug.
      render: text
      placeholder: |
        {name: 'Ada', roles: ['admin',],}
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should laga have returned or done instead?
      placeholder: The input should be repaired to valid JSON and parse to ...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead? Include the exact error or output.
      placeholder: "laga raised LagaError: ..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps so someone else can reproduce the issue.
      placeholder: |
        1. Install laga
        2. Run laga.repair(...) with the sample above
        3. Observe the failure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Share the runtime details that matter for reproduction.
      placeholder: |
        Python:
        laga version:
        OS:
        Shell / editor:
        Installation method:
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: If you found a workaround, describe it here.
      placeholder: Using strict=False avoids the failure, but ...

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Add logs, stack traces, screenshots, or notes that may help.
      placeholder: Any extra detail that could narrow down the root cause.

  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I reduced the example to the smallest reproducible input I could.
          required: true
        - label: I included the exact input, not a paraphrase.
          required: true
        - label: I am using or can reproduce on the latest released version.
          required: true
        - label: I am okay with sharing the sample input publicly in this issue.
          required: true