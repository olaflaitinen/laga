name: Feature request
description: Suggest an improvement, capability, or workflow enhancement for laga.
title: "Feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

        Strong feature requests explain the problem, the desired outcome, and the tradeoffs.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of laga would this affect?
      options:
        - Public API
        - CLI
        - Parser / repair behavior
        - Tokenizer
        - Error handling
        - Documentation
        - Packaging / release
        - Tests / CI
        - GitHub workflow
        - New capability
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this request to you?
      options:
        - Critical
        - High
        - Medium
        - Low
        - Nice to have
    validations:
      required: true

  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility goal
      description: How should this behave relative to current releases?
      options:
        - Backward compatible only
        - Minor compatible change
        - Potentially breaking change
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: target-version
    attributes:
      label: Target version
      description: Which release line should this land in?
      options:
        - 0.1.3
        - 0.2.0
        - 1.0.0
        - Next patch release
        - Future roadmap
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Main surface
      description: Where should the change show up most clearly?
      options:
        - Function signature
        - CLI flag
        - Error message
        - Default behavior
        - Configuration option
        - New helper utility
        - Documentation only
        - Internal improvement
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: Describe the limitation or pain point you are trying to solve.
      placeholder: Today I have to ... which causes ...
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Desired outcome
      description: Describe the behavior, output, or workflow you want.
      placeholder: laga should be able to ...
    validations:
      required: true

  - type: textarea
    id: user_story
    attributes:
      label: User story
      description: Optional, but helpful if you can describe who needs this and why.
      placeholder: As a ... I want ... so that ...

  - type: textarea
    id: examples
    attributes:
      label: Example input or API shape
      description: Show a concrete example of the proposed behavior.
      render: text
      placeholder: |
        laga.repair('{name: "Ada"}')
        # could optionally return ...

  - type: dropdown
    id: input-style
    attributes:
      label: Input style
      description: What kind of input should the feature focus on?
      options:
        - JSON object
        - JSON array
        - Markdown fenced block
        - LLM response text
        - Config file
        - CLI input
        - File input
        - Multiple inputs
    validations:
      required: true

  - type: dropdown
    id: output-style
    attributes:
      label: Output style
      description: What should the output look like?
      options:
        - Python object
        - Compact JSON string
        - Pretty-printed JSON
        - Rich error object
        - Exit code only
        - Multiple formats
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other approaches you evaluated and why they were not enough.
      placeholder: |
        1. Use a post-processing step
        2. Wrap laga in custom logic
        3. Change upstream data generation

  - type: textarea
    id: tradeoffs
    attributes:
      label: Tradeoffs and constraints
      description: Mention any compatibility, performance, or maintenance concerns we should keep in mind.
      placeholder: This should remain backwards compatible with ...

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What would make this feature request complete?
      placeholder: |
        - Works with ...
        - Does not break ...
        - Includes tests/docs ...

  - type: textarea
    id: migration
    attributes:
      label: Migration or rollout notes
      description: If this is a behavioral change, describe how users should migrate.
      placeholder: Existing callers should ...

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add links, screenshots, related issues, or any notes that help frame the request.

  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation checklist
      options:
        - label: I searched existing issues and discussions before opening this request.
          required: true
        - label: I explained the problem and not just the solution.
          required: true
        - label: I included at least one concrete example or user story.
          required: true
        - label: I considered compatibility and rollout impact.
          required: true
        - label: I am comfortable with the request being public.
          required: true